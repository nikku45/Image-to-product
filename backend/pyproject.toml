[project]
name = "product-matcher-backend"
version = "0.1.0"
description = "Backend for Image-to-Amazon.in Product Matching Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "google-generativeai>=0.8.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
